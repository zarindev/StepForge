name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mailpit:install
      - run: npm run check:secrets
      - run: npm run lint
      - run: npm run typecheck
      # The unit tests drive Chromium too, so the browser is installed before them.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: test-results/
          retention-days: 7

  exported-code:
    # Phase 12 done-when: the Playwright project StepForge exports runs green against the demo app.
    name: exported Playwright project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mailpit:install
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:export

  fresh-clone:
    # Phase 13: a fresh clone with only Node + Git → setup → start → onboarding → demo workspace → a run that
    # passes and fails as expected. Uses the documented scripts, nothing else.
    name: fresh clone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      STEPFORGE_OPEN_BROWSER: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup (Linux)
        if: runner.os == 'Linux'
        run: |
          ./setup.sh
          npx playwright install-deps chromium
      - name: Setup (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: setup.bat
      # One step: the Windows runner ends a step's background processes when the step finishes, so starting
      # StepForge in its own step would stop it before the check runs.
      - name: Start, wait for StepForge and run the onboarding smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd //c start.bat > stepforge.log 2>&1 &
          else
            ./start.sh > stepforge.log 2>&1 &
          fi
          up=0
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:4400/api/health && up=1 && break; sleep 2; done
          if [ "$up" != 1 ]; then
            cat stepforge.log
            # Also as an annotation, readable without downloading the job log.
            echo "::error title=StepForge did not start::$(tail -n 60 stepforge.log 2>&1 | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g')"
            exit 1
          fi
          npx tsx scripts/smoke-onboarding.ts http://127.0.0.1:4400
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fresh-clone-${{ matrix.os }}
          path: |
            stepforge*.log
            smoke-onboarding-failure.png

  databases:
    # Real database servers for the DB executor's integration tests (Section 16: SQLite + PostgreSQL + MySQL
    # verified). Service containers only run on Linux runners; the tests skip themselves when a URL is unset.
    name: databases (PostgreSQL, MySQL, SQL Server, MongoDB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: stepforge
          POSTGRES_DB: stepforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: stepforge
          MYSQL_DATABASE: stepforge_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pstepforge" --health-interval 5s --health-timeout 5s
          --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'StepForge#2026'
        ports: ['1433:1433']
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mailpit:install
      - run: npm run k6:install
      # packages/perf's page-metric tests drive Chromium.
      - run: npx playwright install --with-deps chromium
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/1433) 2>/dev/null && break; sleep 2; done
          sleep 15
      - run: npx vitest run packages/executors/database packages/perf
        env:
          STEPFORGE_TEST_PG_URL: postgres://postgres:stepforge@127.0.0.1:5432/stepforge_test
          STEPFORGE_TEST_MYSQL_URL: mysql://root:stepforge@127.0.0.1:3306/stepforge_test
          STEPFORGE_TEST_MSSQL_URL: Server=127.0.0.1,1433;Database=master;User Id=sa;Password=StepForge#2026;Encrypt=true;TrustServerCertificate=true
          STEPFORGE_TEST_MONGO_URL: mongodb://127.0.0.1:27017
