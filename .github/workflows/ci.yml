name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mailpit:install
      - run: npm run check:secrets
      - run: npm run lint
      - run: npm run typecheck
      # The unit tests drive Chromium too, so the browser is installed before them.
      - run: npx playwright install --with-deps chromium
      # The desktop-app tests open Electron windows. Electron downloads its binary on first use: fetch it now.
      # Linux runners also need Electron's sandbox helper set up and a virtual display.
      - run: node node_modules/electron/install.js
      - name: Set up Electron (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm test
      - run: npm run build
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: test-results/
          retention-days: 7

  exported-code:
    # Phase 12 done-when: the Playwright project StepForge exports runs green against the demo app.
    name: exported Playwright project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mailpit:install
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:export

  fresh-clone:
    # Phase 13: a fresh clone with only Node + Git → setup → start → onboarding → demo workspace → a run that
    # passes and fails as expected. Uses the documented scripts, nothing else.
    name: fresh clone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      STEPFORGE_OPEN_BROWSER: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup (Linux)
        if: runner.os == 'Linux'
        run: |
          ./setup.sh
          npx playwright install-deps chromium
      - name: Setup (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: setup.bat
      # One step: the Windows runner ends a step's background processes when the step finishes, so starting
      # StepForge in its own step would stop it before the check runs.
      - name: Start, wait for StepForge and run the onboarding smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd //c start.bat > stepforge.log 2>&1 &
          else
            ./start.sh > stepforge.log 2>&1 &
          fi
          up=0
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:4400/api/health && up=1 && break; sleep 2; done
          if [ "$up" != 1 ]; then
            cat stepforge.log
            # Also as an annotation, readable without downloading the job log.
            echo "::error title=StepForge did not start::$(tail -n 60 stepforge.log 2>&1 | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g')"
            exit 1
          fi
          npx tsx scripts/smoke-onboarding.ts http://127.0.0.1:4400
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fresh-clone-${{ matrix.os }}
          path: |
            stepforge*.log
            smoke-onboarding-failure.png

  databases:
    # Real database servers for the DB executor's integration tests (Section 16: SQLite + PostgreSQL + MySQL
    # verified). Service containers only run on Linux runners; the tests skip themselves when a URL is unset.
    name: databases and Kafka (PostgreSQL, MySQL, SQL Server, MongoDB, Kafka)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: stepforge
          POSTGRES_DB: stepforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: stepforge
          MYSQL_DATABASE: stepforge_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pstepforge" --health-interval 5s --health-timeout 5s
          --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'StepForge#2026'
        ports: ['1433:1433']
      mongo:
        image: mongo:7
        ports: ['27017:27017']
      # Single-node Kafka (KRaft) for the Kafka steps; advertised on localhost:9092 by default.
      kafka:
        image: apache/kafka:4.1.0
        ports: ['9092:9092']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mailpit:install
      - run: npm run k6:install
      # packages/perf's page-metric tests drive Chromium.
      - run: npx playwright install --with-deps chromium
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/1433) 2>/dev/null && break; sleep 2; done
          sleep 15
      - name: Wait for Kafka
        run: for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/9092) 2>/dev/null && break; sleep 2; done
      - run: npx vitest run packages/executors/database packages/perf packages/executors/api/test/kafka.test.ts packages/executors/api/test/kafka-newtopic.test.ts
        env:
          STEPFORGE_TEST_PG_URL: postgres://postgres:stepforge@127.0.0.1:5432/stepforge_test
          STEPFORGE_TEST_MYSQL_URL: mysql://root:stepforge@127.0.0.1:3306/stepforge_test
          STEPFORGE_TEST_MSSQL_URL: Server=127.0.0.1,1433;Database=master;User Id=sa;Password=StepForge#2026;Encrypt=true;TrustServerCertificate=true
          STEPFORGE_TEST_MONGO_URL: mongodb://127.0.0.1:27017
          STEPFORGE_TEST_KAFKA: localhost:9092

  android:
    # Android apps: the demo app (demo/android-app) on an emulator, through Appium (installed into data/tools).
    # Linux runners have hardware acceleration (KVM) once it is opened to the runner's user.
    name: Android app on an emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run appium:install
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator download or boot sometimes fails on the runner: one more attempt before failing the job.
      - id: android-1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # One emulator: the test files take turns.
          script: STEPFORGE_TEST_ANDROID=1 npx vitest run --no-file-parallelism packages/executors/native apps/server/test/android-apps.test.ts
      - if: steps.android-1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # One emulator: the test files take turns.
          script: STEPFORGE_TEST_ANDROID=1 npx vitest run --no-file-parallelism packages/executors/native apps/server/test/android-apps.test.ts

  ios:
    # iOS apps: the demo app (demo/ios-app, built with Xcode's compiler) on a simulator, through Appium (XCUITest).
    # macOS runners come with Xcode and simulators; the first test builds Appium's helper app.
    name: iOS app on a simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run appium:install
      - run: npx tsx scripts/build-ios-demo.ts
      - run: ./stepforge.sh doctor native --platform ios
        # Printed for the log; the tests below fail on their own if something is missing.
        continue-on-error: true
      # One simulator: the test files take turns. The macOS runners are sometimes slow enough that a step stalls on
      # the simulator (typing, a tap): a failed test gets one more attempt, so only a failure that repeats fails the job.
      - run: npx vitest run --no-file-parallelism --retry=1 packages/executors/native/test/ios.test.ts apps/server/test/ios-apps.test.ts
        env:
          STEPFORGE_TEST_IOS: '1'

  macos-desktop:
    # Native macOS apps: the demo app (demo/macos-app, AppKit) through Appium (Mac2). Automation Mode lets XCTest
    # drive apps without a password prompt.
    name: macOS desktop app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run appium:install
      - run: sudo automationmodetool enable-automationmode-without-authentication
      - run: npx tsx scripts/build-macos-demo.ts
      - run: ./stepforge.sh doctor native --platform macos
        # Printed for the log; the tests below fail on their own if something is missing.
        continue-on-error: true
      - run: npx vitest run packages/executors/native/test/desktop.test.ts
        env:
          STEPFORGE_TEST_MACOS: '1'

  windows-desktop:
    # Native Windows apps: the demo app (demo/windows-app, WinForms, built with .NET) through Appium (NovaWindows).
    name: Windows desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run appium:install
      - run: dotnet build demo/windows-app -c Release -o demo/windows-app/build
      - run: node apps/cli/bin/stepforge.mjs doctor native --platform windows
        continue-on-error: true
      - run: npx vitest run packages/executors/native/test/desktop.test.ts
        env:
          STEPFORGE_TEST_WINDOWS: '1'

  linux-desktop:
    # Linux desktop apps: the demo GTK app (demo/linux-app) through StepForge's AT-SPI helper, in a D-Bus session
    # (the accessibility bus) on a virtual display.
    name: Linux desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install GTK and the accessibility layer
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core xvfb dbus-x11
      - run: dbus-run-session -- xvfb-run -a node apps/cli/bin/stepforge.mjs doctor native --platform linux
        continue-on-error: true
      - run: dbus-run-session -- xvfb-run -a npx vitest run packages/executors/native/test/linux.test.ts
        env:
          STEPFORGE_TEST_LINUX: '1'
