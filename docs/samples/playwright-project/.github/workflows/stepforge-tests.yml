name: CareClinic tests
on:
  push:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.BASE_URL || 'http://127.0.0.1:8101' }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL || 'admin@careclinic.test' }}
      RECEPTION_EMAIL: ${{ vars.RECEPTION_EMAIL || 'reception@careclinic.test' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      PASSWORD: ${{ secrets.PASSWORD }}
      DB_CLINIC_URL: ${{ secrets.DB_CLINIC_URL }}
      MAILPIT_URL: ${{ vars.MAILPIT_URL || 'http://127.0.0.1:8025' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
